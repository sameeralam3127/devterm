  #       args: ["--profile", "black", "--line-length", "88", "--skip-gitignore"]

  # Docstring checks - Disabled for now due to extensive existing violations
  # TODO: Re-enable after fixing docstrings incrementally
  # - repo: https://github.com/pycqa/pydocstyle
  #   rev: 6.3.0
  #   hooks:
