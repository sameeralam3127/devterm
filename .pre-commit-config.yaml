  #       args: ["--convention=google"]
  #       exclude: ^tests/

  # YAML formatting - Disabled due to pkg_resources compatibility issue with Python 3.13
  # - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  #   rev: v2.12.0
