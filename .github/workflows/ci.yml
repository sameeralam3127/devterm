name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x install.sh uninstall.sh lib/common.sh tools/record-demo.sh
      - name: Generated profiles are up to date
        run: python3 tools/build.py --check

  macos-dry-run:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install (dry run, all apps)
        run: ./install.sh --profile midnight --dry-run --yes
      - name: Install (dry run, Terminal.app only)
        run: ./install.sh --profile daylight --app terminal --dry-run --yes
      - name: Uninstall (dry run)
        run: ./uninstall.sh --dry-run --yes
