# devterm starship config — theme: Daylight
# Generated by tools/build.py. Edit themes/*.json or templates/, then rebuild.
# Context modules only appear when relevant to the current folder.

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$kubernetes\
$aws\
$terraform\
${custom.ansible}\
$python\
$golang\
$nodejs\
$docker_context\
$cmd_duration
$character"""

# Mac name, CPU and RAM only appear in Terminal.app (iTerm2 shows them in its status bar)
right_format = "${custom.host}${custom.cpu}${custom.mem}$time"

# ── Location ─────────────────────────────────────────
[directory]
style = "bold #2f6fd6"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "#c8323c"
format = '[ $path]($style)[$read_only]($read_only_style) '

# ── Git ──────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold #8e44ad"
format = '[$symbol$branch]($style) '

[git_status]
style = "#a36a00"
format = '([\[$all_status$ahead_behind\]]($style) )'

# ── Kubernetes: only inside k8s / helm / kustomize folders ──
[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold #1b8a9a"
format = '[$symbol$context( \($namespace\))]($style) '
detect_files = ["Chart.yaml", "kustomization.yaml", "helmfile.yaml", "skaffold.yaml", "Tiltfile"]
detect_folders = ["k8s", "charts", "manifests", "helm", "kubernetes"]
detect_extensions = []

[[kubernetes.contexts]]
context_pattern = "docker-desktop"
context_alias = "local"
style = "#8a8f98"

[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bold #c8323c"

# ── Cloud / IaC ──────────────────────────────────────
[aws]
symbol = " "
style = "bold #a36a00"
format = '[$symbol($profile)( \($region\))]($style) '

[terraform]
symbol = "󱁢 "
style = "bold #8e44ad"
format = '[$symbol$workspace]($style) '

[custom.ansible]
detect_files = ["ansible.cfg", "galaxy.yml", "requirements.yml", "site.yml"]
symbol = "󱂚 "
style = "bold #c8323c"
format = '[$symbol ansible]($style) '

# ── Languages ────────────────────────────────────────
[python]
symbol = " "
style = "#3f8a3a"
format = '[$symbol$version( \($virtualenv\))]($style) '
detect_files = [
  "requirements.txt", "requirements-dev.txt", "pyproject.toml", "setup.py",
  "setup.cfg", "Pipfile", "tox.ini", "pytest.ini", ".python-version", "__init__.py",
]

[golang]
symbol = " "
style = "#1b8a9a"
format = '[$symbol$version]($style) '

[nodejs]
symbol = " "
style = "#3f8a3a"
format = '[$symbol$version]($style) '

[docker_context]
symbol = " "
style = "#2f6fd6"
only_with_files = true
format = '[$symbol$context]($style) '

# ── Timing ───────────────────────────────────────────
[cmd_duration]
min_time = 2000
style = "#a36a00"
format = '[ $duration]($style) '

[time]
disabled = false
style = "#8a8f98"
time_format = "%H:%M"
format = '[$time]($style)'

# ── System info: Terminal.app only ───────────────────
# Terminal.app has no status bar, so show what iTerm2's status bar would.
[custom.host]
when = 'test "$TERM_PROGRAM" = Apple_Terminal'
command = 'hostname -s'
shell = ["sh"]
symbol = "󰌢 "
style = "#3f8a3a"
format = '[$symbol$output]($style) '

[custom.cpu]
when = 'test "$TERM_PROGRAM" = Apple_Terminal'
command = '''ps -A -o %cpu= | awk -v n="$(sysctl -n hw.logicalcpu)" '{s+=$1} END {printf "%.0f%%", s/n}''''
shell = ["sh"]
symbol = " "
style = "#1b8a9a"
format = '[$symbol$output]($style) '

# RAM used = active + wired + compressed, like Activity Monitor's "Memory Used"
[custom.mem]
when = 'test "$TERM_PROGRAM" = Apple_Terminal'
command = '''vm_stat | awk -v ps="$(pagesize)" -v t="$(sysctl -n hw.memsize)" '/Pages active/ {a=$3} /Pages wired/ {w=$4} /occupied by compressor/ {c=$5} END {printf "%.1f/%.0f GB", (a+w+c)*ps/1073741824, t/1073741824}''''
shell = ["sh"]
symbol = "󰍛 "
style = "#8e44ad"
format = '[$symbol$output]($style) '

# ── Prompt symbol: green on success, red on error ────
[character]
success_symbol = "[❯](bold #3f8a3a)"
error_symbol = "[❯](bold #c8323c)"
